<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CargoIQ Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <h1>CargoIQ</h1>
        <p>Smart Cargo Loading System</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
